<html>
<head>
    <title>Creative Squad</title>
    <link rel="stylesheet" href="HomeStyling.css">
</head>

<body>

<header>

    <h1>Creative Squad</h1>
    <p>Meet our team and explore each member’s skills, goals, and professional profile.</p>
</header>
    
<main class="team-container">

    <section class="member-card">
        <img src="profile.jpg" alt="Hermilo Profile">
        <h2>Hermilo Hernandez</h2>
        <p>Marketing & Team Coordination</p>
        <input type="button" value="View Full Profile" id="hermiloBtn">
    </section>

    <section class="member-card">
        <img src="lee.jpg" alt="Leonardo Profile">
        <h2>Leonardo Lee</h2>
        <p>Networker</p>
        <input type="button" value="View Full Profile" id="leeBtn">
    </section>

    <section class="member-card">
        <img src="Hendry.jpg" alt="Hendry Profile">
        <h2>Hendry Bello</h2>
        <p>Team Leader</p>
       <input type="button" value="View Full Profile" id="hendryBtn">
    </section>

    <section class="member-card">
        <img src="fiza.jpg" alt="Fiza Profile">
        <h2>Fiza Rashid</h2>
        <p>Cybersecurity Specialist</p>
        <input type="button" value="View Full Profile" id="fizaBtn">
    </section>

   
</main>
    
<script src="script.js"></script>

</html>
